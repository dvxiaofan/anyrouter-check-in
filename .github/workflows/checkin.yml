name: AnyRouter 自动签到
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试模式（截图 artifact、详细日志）— public 仓库慎用，见下方注释
        required: false
        default: false
        type: boolean

# 最小权限：checkout 需要 contents:read，此外什么都不需要。
# 单个 job 若需更多权限，在该 job 内单独声明（见 keepalive）。
permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      with:
        version: "latest"

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
      id: uv-cache
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      run: |
        uv sync --frozen
        echo "✅ 环境初始化完成"

    # xvfb + 字体：session cookie 模式下其实走不到（checkin.py 取 WAF cookie 时硬编码
    # headless=True），保留是为了 cookie 失效时能临时切回 email/password 登录顶一下。
    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
          fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

    - name: 缓存 CloakBrowser 二进制
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
      id: cloakbrowser-cache
      with:
        path: ~/.cloakbrowser
        key: ${{ runner.os }}-cloakbrowser-v1
        restore-keys: |
          ${{ runner.os }}-cloakbrowser-

    - name: 安装 CloakBrowser
      run: |
        uv run python -m cloakbrowser install
        echo "✅ CloakBrowser 安装完成"

    - name: 恢复余额历史缓存
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
      with:
        path: balance_hash.txt
        key: balance-hash-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          balance-hash-${{ github.ref_name }}-
          balance-hash-

    - name: 恢复浏览器 Profile 缓存
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
      with:
        path: .browser_profiles
        key: browser-profiles-${{ runner.os }}-v1
        restore-keys: |
          browser-profiles-${{ runner.os }}-

    - name: 执行签到
      env:
        DEBUG_MODE: ${{ env.DEBUG_MODE }}
        CHECKIN_HEADLESS: false
        CHECKIN_HUMANIZE: true
        CHECKIN_WAIT_TIMEOUT_MS: 120000
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        # 通知只用 Telegram。其余 8 个渠道的 env 已移除：未配置的渠道每轮都会
        # 打一行 "Message push failed! Reason: X not configured"，把真正的失败
        # 淹掉。要加别的渠道，在这里补上对应 secret 名即可（见 utils/notify.py）。
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py

    # 🔴 本仓库是 public：这个 artifact 任何人都能下载，而截图是 full_page 的
    #    「已登录 console 页」（含邮箱、用户 ID、余额，可能还有 API Key）。
    #    只在手动 dispatch 且勾选 debug 时才产生，保留期已从 14 天压到 1 天。
    #    调试请优先在本地跑：截图落 checkin_screenshots/，已被 .gitignore 覆盖。
    - name: 上传调试截图
      if: always() && env.DEBUG_MODE == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: checkin-screenshots-${{ github.run_id }}
        path: checkin_screenshots/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 1

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(date)"
        if [ "${DEBUG_MODE}" = "true" ] && [ -d checkin_screenshots ] && [ "$(ls -A checkin_screenshots 2>/dev/null)" ]; then
          echo "调试截图已上传为 artifact: checkin-screenshots-${{ github.run_id }}"
          ls -la checkin_screenshots/
        fi

  # public 仓库若 60 天无活动，GitHub 会自动停掉 scheduled workflow 且不通知。
  # 本仓库刻意冻结不同步上游，必然会踩到这条规则，所以每次定时运行都抢先
  # 调 API 把自己重新 enable 一次。相比推空 commit：不污染提交历史、不需要
  # contents:write、不引入第三方 action。
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write        # 仅本 job；checkin job 仍是 contents:read
    steps:
    - name: 抢先重新启用本 workflow
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api -X PUT "repos/${{ github.repository }}/actions/workflows/checkin.yml/enable" \
          && echo "✅ keepalive: workflow 已确认为启用状态"
